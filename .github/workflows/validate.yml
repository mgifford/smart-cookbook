name: Validate & Index Recipes

on:
  push:
    branches: [main]
    paths:
      - 'recipes/**/*.yaml'
      - 'schemas/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'recipes.json'
  pull_request:
    paths:
      - 'recipes/**/*.yaml'
      - 'schemas/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'recipes.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate YAML syntax
        run: npm run validate:yaml

      - name: Validate JSON Schema and stable IDs
        run: npm run validate:schema

      - name: Validate recipe quality
        run: npm run validate:recipes

      - name: Check generated recipe index
        run: npm run check:index

      - name: Run unit fixtures
        run: npm run test:unit
