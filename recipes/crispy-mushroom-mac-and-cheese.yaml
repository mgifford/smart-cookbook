  - date: 2026-11-22
    note: "Proposed adaptation; not yet kitchen-tested."
    change: "Created a weeknight version inspired by Olive + Gourmando, simplified to supermarket ingredients; documented the crust experiments in docs/crispy-mushroom-mac-and-cheese-testing.md."
