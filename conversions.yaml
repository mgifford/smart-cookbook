# Handy quick refs
quick_refs:
  grams_to_ounces: "g / 28.3495"
  ounces_to_grams: "oz * 28.3495"
  cups_to_ml: "cups * 240"
  ml_to_cups: "ml / 240"
  tbsp_to_ml: "tbsp * 15"
  tsp_to_ml: "tsp * 5"
  ml_to_tbsp: "ml / 15"
  ml_to_tsp: "ml / 5"

