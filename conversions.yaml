# Notes for recipe authors:
# 1. When converting recipes, prefer whole units when natural:
#    "1 large egg" is better than "57g egg"
#    "2 medium bananas" is better than "236g banana"
# 2. Keep vol_est strings descriptive: "1 large egg" vs "1 egg"
# 3. Use densities_g_per_cup for volume conversions (flour, sugar, etc.)
# 4. Use whole_units_to_grams for counted items (eggs, vegetables, etc.)
# 5. Sources: USDA FoodData Central, standard kitchen measurements
