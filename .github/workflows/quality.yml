name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # ubuntu-latest currently resolves to 26.04, which Playwright 1.57 does not support.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check quality gate policy
        run: node scripts/check-ci-policy.js

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full quality gate
        run: npm run quality
