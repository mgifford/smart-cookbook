# Ingredient display preferences
# When displaying scaled ingredients, prefer certain units for readability
ingredient_display_prefs:
  description: "Default display units for common ingredients. Prefer volume or whole units over grams."
  by_name:
    salt: "tsp"  # 1 tsp salt ≈ 6g, but humans prefer volume
    baking_soda: "tsp"  # 1 tsp ≈ 5g
    baking_powder: "tsp"  # 1 tsp ≈ 5g
    vanilla_extract: "tsp"
    almond_extract: "tsp"
    dijon_mustard: "tsp"
    lemon_juice: "tbsp"
    lime_juice: "tbsp"
    orange_juice: "tbsp"
    soy_sauce: "tbsp"
    vinegar: "tbsp"
    hot_sauce: "tsp"
    worcestershire_sauce: "tsp"
    honey: "tbsp"
    maple_syrup: "tbsp"
    molasses: "tbsp"
    peanut_butter: "tbsp"
    tahini: "tbsp"
    sea_salt: "tsp"
    cinnamon: "tsp"
    nutmeg: "tsp"
    ginger: "tsp"
    cayenne: "tsp"
    paprika: "tsp"
    black_pepper: "tsp"
  aliases:
    kosher_salt: "salt"
    table_salt: "salt"
    fine_sea_salt: "sea_salt"
    caster_sugar: "granulated_sugar"
    confectioners_sugar: "powdered_sugar"
    icing_sugar: "powdered_sugar"
    brown_sugar_packed: "brown_sugar"
    dark_brown_sugar: "brown_sugar"
    light_brown_sugar: "brown_sugar"
    greek_yoghurt: "greek_yogurt"
    ap_flour: "all-purpose_flour"
    all_purpose_flour: "all-purpose_flour"
    plain_flour: "all-purpose_flour"
    wholemeal_flour: "whole_wheat_flour"
    icing_sugar_powdered: "powdered_sugar"
    powdered_sugar: "powdered_sugar"
    rolled_oats: "oats"
    old_fashioned_oats: "oats"
    whole_milk: "milk"
    buttermilk: "milk"
    heavy_cream: "cream"
    double_cream: "cream"
  by_category:
    spices: "tsp"  # cinnamon, nutmeg, ginger, etc.
    herbs_dried: "tsp"
    herbs_fresh: "tbsp"
    zest: "tbsp"  # lemon zest, orange zest, etc.

# Volume-to-gram conversions for common spices/leavening
# Use these to populate qty_g when recipe has volume measurements
